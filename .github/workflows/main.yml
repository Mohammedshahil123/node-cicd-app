name: Full Node CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Lint
        run: echo "Lint skipped"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Test
        run: echo "Test skipped"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t node-cicd-app .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        run: echo "Deploy successful 🚀"
