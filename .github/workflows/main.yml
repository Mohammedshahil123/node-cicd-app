[11:13 pm, 19/5/2026] business: name: Full Node CI/CD Pipeline 🚀

on:
  push:
    branches: [main]

jobs:

  lint:
    name: Lint Code 🧹
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint . || true


  test:
    name: Run Tests 🧪
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Run Test Script
        run: node test.js


  build:
    name: Build Docker Image 🐳
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Image
        run: docker build -t node-cicd-app .


  scan:
    name: Security Scan 🔍
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Scan Docker Image using Trivy
        run: docker run --rm aquasec/trivy image node-cicd-app


  deploy:
    name: Deploy 🚀
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Deployment Step
        run: echo "🚀 Application Deployed Successfully"

